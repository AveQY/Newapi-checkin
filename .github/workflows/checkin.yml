name: NewAPI 自动签到

on:
  # 定时执行：每天 5 次，全部落在北京时间 10:00~20:00 区间
  # 北京时间 10:05 / 12:35 / 15:05 / 17:35 / 20:05  ->  UTC 02:05 / 04:35 / 07:05 / 09:35 / 12:05
  # 分钟刻意错开（5 / 35 交替），避开 GitHub 整点排队（高峰期可能延迟 5~30 分钟）
  # 已签到的轮次脚本会自动跳过并记为成功；失败则下一轮自动重试
  schedule:
    - cron: '5 2 * * *'
    - cron: '35 4 * * *'
    - cron: '5 7 * * *'
    - cron: '35 9 * * *'
    - cron: '5 12 * * *'
  # 手动触发
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 安装 Playwright 浏览器
        run: playwright install chromium --with-deps

      - name: 确认 Chrome 与 xvfb
        run: |
          google-chrome --version
          which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: 执行签到（xvfb 虚拟显示，含 Turnstile 解验证）
        env:
          CONFIG_URL: ${{ secrets.CONFIG_URL }}
          CONFIG_AUTH: ${{ secrets.CONFIG_AUTH }}
          NEWAPI_ACCOUNTS: ${{ secrets.NEWAPI_ACCOUNTS }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          # 仅在「全部账号都失败」时推送通知（其余情况静默）
          NOTIFY_ONLY_FAILURE: "all"
          EMAIL_SMTP_HOST: ${{ secrets.EMAIL_SMTP_HOST }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: xvfb-run --auto-servernum python checkin.py
